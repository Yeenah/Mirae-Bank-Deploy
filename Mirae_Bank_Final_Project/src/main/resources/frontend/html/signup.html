<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="utf-8"/>
 <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
 <title>
  Mirae Bank - Create Profile
 </title>
 <link href="../css/signup.css" rel="stylesheet"/>
</head>
<body>
<main class="auth-container">
 <section class="auth-card">
  <!-- BRAND -->
  <div class="brand">
   <img alt="Mirae Bank Logo" class="brand-logo" src="../Assets/images/mirae logo.png"/>
   <div>
    <strong>
     MIRAE BANK
    </strong>
    <span>
       Banking Management System
      </span>
   </div>
  </div>
  <!-- HEADER -->
  <div class="page-header">
   <p class="eyebrow">
    GET STARTED
   </p>
   <h1>
    Create your account
   </h1>
   <p class="subtitle">
    Create your Mirae Bank customer profile.
   </p>
  </div>
  <!-- Error message -->
  <div class="message error" id="signupError" role="alert" style="display:none;">
  </div>
  <!-- Success message -->
  <div class="message success" id="signupSuccess" role="alert" style="display:none;">
  </div>
  <!-- Signup form -->
  <form id="signupForm" novalidate="">
   <!-- FULL NAME -->
   <div class="field">
    <label for="fullName">
     Full Name
    </label>
    <div class="input-wrapper">
     <input autocomplete="name" id="fullName" name="fullName" placeholder="Enter your full name" required="" type="text"/>
    </div>
   </div>
   <!-- Username -->
   <div class="field">
    <label for="username">
     Username
    </label>
    <div class="input-wrapper">
     <input autocomplete="username" id="username" name="username" placeholder="Choose a username" required="" type="text"/>
    </div>
   </div>
   <!-- EMAIL -->
   <div class="field">
    <label for="email">
     Email
    </label>
    <div class="input-wrapper">
     <input autocomplete="email" id="email" name="email" placeholder="juan@gmail.com" required="" type="email"/>
    </div>
   </div>
   <!-- Password -->
   <div class="field">
    <label for="password">
     Password
    </label>
    <div class="input-wrapper">
     <input autocomplete="new-password" id="password" name="password" placeholder="Create a password" required="" type="password"/>
    </div>
    <small class="field-hint">
     Password must be at least 6 characters.
    </small>
   </div>
   <!-- CONFIRM PASSWORD -->
   <div class="field">
    <label for="confirmPassword">
     Confirm Password
    </label>
    <div class="input-wrapper">
     <input autocomplete="new-password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required="" type="password"/>
    </div>
   </div>
   <!-- Button -->
   <button class="primary-button" id="signupButton" type="submit">
    Create Profile
   </button>
  </form>
  <!-- Login link -->
  <p class="login-link">
   Already have an account?
   <a href="signin.html">
    Sign in
   </a>
  </p>
  <!-- Footer -->
  <footer class="footer">
     <span>
      © 2026 Mirae Bank
     </span>
   <span>
      Your Money • Your Future • Your Control
     </span>
  </footer>
 </section>
</main>
<script src="../js/signup.js">
</script>
</body>
</html>
